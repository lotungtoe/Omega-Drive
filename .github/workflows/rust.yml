name: Build Setup

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  RUSTFLAGS: ""

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: ui/dist/

  build:
    needs: frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: ui/dist/
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: true
      - name: Download mpv DLLs
        shell: pwsh
        run: |
          $dir = "src-tauri/crates/tauri_app"
          curl -sL -o "$dir/mpv.dll" "https://github.com/lotungtoe/Omega-Drive/releases/download/deps-v1/mpv.dll"
          curl -sL -o "$dir/libmpv-2.dll" "https://github.com/lotungtoe/Omega-Drive/releases/download/deps-v1/libmpv-2.dll"
          Copy-Item "$dir/mpv.dll" "$dir/mpv-1.dll"
      - run: npx @tauri-apps/cli build --target x86_64-pc-windows-msvc --config src-tauri/crates/tauri_app/tauri.conf.json -- --profile release-fast
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats
      - name: Create portable ZIP (PR)
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release-fast/Omega-Drive.exe"
          if (-not (Test-Path $exe)) { $exe = "target/x86_64-pc-windows-msvc/release-fast/omega_drive.exe" }
          if (-not (Test-Path $exe)) { $exe = "target/x86_64-pc-windows-msvc/release/Omega-Drive.exe" }
          $zip = "target/x86_64-pc-windows-msvc/release-fast/Omega-Drive-portable.zip"
          $tmp = "portable_tmp/Omega-Drive"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          if (Test-Path $exe) { Copy-Item $exe "$tmp/" -Force } else { Write-Host "WARN: exe not found at $exe" }
          Copy-Item "src-tauri/crates/tauri_app/mpv.dll" "$tmp/" -Force -ErrorAction SilentlyContinue
          Copy-Item "src-tauri/crates/tauri_app/libmpv-2.dll" "$tmp/" -Force -ErrorAction SilentlyContinue
          Copy-Item "src-tauri/crates/tauri_app/mpv-1.dll" "$tmp/" -Force -ErrorAction SilentlyContinue
          if (Test-Path "src-tauri/resources") { Copy-Item "src-tauri/resources" "$tmp/resources" -Recurse -Force -ErrorAction SilentlyContinue }
          Compress-Archive -Path "$tmp/*" -DestinationPath $zip -Force
          Write-Host "Portable ZIP created at $zip"
          Get-ChildItem $zip | Format-List
      - uses: actions/upload-artifact@v5
        with:
          name: Omega-Drive-x86_64-pc-windows-msvc
          path: target/x86_64-pc-windows-msvc/release-fast/bundle/**/*
      - uses: actions/upload-artifact@v5
        with:
          name: Omega-Drive-portable
          path: target/x86_64-pc-windows-msvc/release-fast/Omega-Drive-portable.zip
          if-no-files-found: warn
